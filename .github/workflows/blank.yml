

name: Build Cyber Shields Pro Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'cyber_shields.ico'
      - '.github/workflows/blank.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --clean --onefile --windowed --icon=cyber_shields.ico --name="Cyber Shields Pro" cyber_shields_pro.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Cyber-Shields-Pro-Windows
          path: dist/Cyber Shields Pro.exe
